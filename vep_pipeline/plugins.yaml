SubsetVCF:           {module: SubsetVCF, category: user_file}
TranscriptAnnotator: {module: TranscriptAnnotator, category: user_file}
DeNovo:              {module: DeNovo, category: user_file}
ProteinSeqs:         {module: ProteinSeqs, category: user_file}
SingleLetterAA:      {module: SingleLetterAA, category: user_file}
