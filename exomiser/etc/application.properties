# ═══════════════════════════════════════════════════════════════════════════
# Exomiser 15.1.0 site configuration -- AG Bunina
#
# Absolute paths throughout, deliberately: the shipped file's ${...} tokens
# are Spring property placeholders, and relying on them has bitten people
# (the upstream docs set cadd.version=1.4 while telling you to download 1.7).
#
# Loaded via -Dspring.config.location=<this file>, which REPLACES the default
# search locations -- so the distribution's own application.properties (which
# activates hg19) does not apply. That matters: we have no hg19 data, and
# loading an absent assembly is a hard failure.
# ═══════════════════════════════════════════════════════════════════════════

exomiser.data-directory=/fast/AG_Bunina/Berk/tools/exomiser/data

# ── Genome assembly: hg38 ONLY ───────────────────────────────────────────
# Each additional assembly loaded costs ~1.5 GB resident RAM. Do not add
# any exomiser.hg19.* key unless the hg19 data bundle is also installed.
exomiser.hg38.data-version=2602
exomiser.hg38.transcript-source=ensembl

# ── ClinVar ──────────────────────────────────────────────────────────────
# Since 14.0.0 the whitelist is loaded from the clinvar.mv.db in the data
# bundle; no separate whitelist download is needed.
# NOTE: whitelisted variants bypass ALL filters and score maximally. Correct
# for diagnostics, WRONG for benchmarking -- set to false when benchmarking.
exomiser.hg38.use-clinvar-white-list=true

# ── Phenotype data (required for every analysis) ─────────────────────────
exomiser.phenotype.data-version=2602

# ── Genomiser ────────────────────────────────────────────────────────────
# This single line is what turns Genomiser on. Listing REMM in an analysis
# without this path makes Exomiser halt (by design, not a bug).
exomiser.hg38.remm-path=/fast/AG_Bunina/Berk/tools/exomiser/data/remm/ReMM.v0.4.hg38.tsv.gz

# ── CADD v1.7: genome pass only. Enabled in Task 10. ─────────────────────
# Rationale for genome-only: Exomiser normalises CADD PHRED so 10 -> 0.9 and
# takes the MAX across sources, saturating most exonic variants at >=0.98
# (Cooperstein et al. 2025, Genome Med). But the non-coding gate in
# pathogenicityFilter is (CADD>=15) OR (SpliceAI>0.1) OR (ReMM>0.914), and
# ReMM has no splice signal at all (Schubach et al. 2023), so CADD earns its
# place there. Never in the exome pass.
# NOTE: CADD lives flat in data/ (pre-existing download, see data/filelist);
# not moved, because it is 88 GB.
exomiser.hg38.cadd-snv-path=/fast/AG_Bunina/Berk/tools/exomiser/data/whole_genome_SNVs.tsv.gz
exomiser.hg38.cadd-in-del-path=/fast/AG_Bunina/Berk/tools/exomiser/data/gnomad.genomes.r4.0.indel.tsv.gz

# ── Caching ──────────────────────────────────────────────────────────────
# The cache key is the allele key, and a single WGS run queries each allele
# key exactly once -- so intra-sample hit rate is ~0: caching buys nothing on
# one genome and only costs heap. Leaving this unset risks Spring Boot
# auto-configuring an UNBOUNDED Caffeine cache. Set explicitly.
# Switch to caffeine + a bounded spec only for `batch` runs over many samples.
spring.cache.type=none
#spring.cache.caffeine.spec=maximumSize=60000

# ── Logging ──────────────────────────────────────────────────────────────
# Default only; exomiser-env.sh overrides this per-run. Spring Boot's own
# default is /tmp/spring.log, which on a shared cluster is created 0644 by
# the first user and then kills every other user's job (issue #541).
logging.file.name=/fast/AG_Bunina/Berk/tools/exomiser/logs/exomiser.log
logging.level.com.zaxxer.hikari=ERROR
